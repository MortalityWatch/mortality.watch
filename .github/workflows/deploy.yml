name: deploy

on:
  workflow_run:
    workflows: ['ci']
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    environment: production
    env:
      DOKKU_APP: www-mortality-watch
      DOKKU_HOST: ${{ vars.DOKKU_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH
        env:
          DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
        run: |
          if [ -z "$DOKKU_HOST" ]; then
            echo "DOKKU_HOST repository variable is not set" >&2
            exit 1
          fi
          if [ -z "$DOKKU_SSH_KEY" ]; then
            echo "DOKKU_SSH_KEY repository secret is not set" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DOKKU_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in 1 2 3; do
            ssh-keyscan -T 15 -H "$DOKKU_HOST" >> ~/.ssh/known_hosts && break
            if [ "$attempt" = "3" ]; then
              echo "Unable to read SSH host key from $DOKKU_HOST:22" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Deploy to Dokku
        run: git push "dokku@$DOKKU_HOST:$DOKKU_APP" HEAD:master --force
